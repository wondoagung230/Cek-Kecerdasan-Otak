<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Player - Kuis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      background: #0f172a url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExNnZqbjE1M3F3YjhwdnZ0cjQyMTRpM25vOHd2MTB4dmZhY3plYnZiaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wrmVCNbpOyqgJ9zQTn/giphy.gif') center center / cover no-repeat fixed;
      min-height: 100vh;
    }
    .bg-overlay {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.88) 0%, rgba(76, 29, 149, 0.82) 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="text-white select-none">
  <div class="bg-overlay flex flex-col min-h-screen">
    <div class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full">

      <!-- Login Section -->
      <div id="login" class="flex-1 flex flex-col justify-center space-y-5">
        <div class="text-center">
          <h1 class="text-3xl font-extrabold mb-1 drop-shadow-lg text-yellow-300">Kuis Pendidikan</h1>
          <p class="text-indigo-200 text-sm">SD • SMP • SMA</p>
        </div>
        <input id="nickname" type="text" placeholder="Nama kamu" maxlength="16"
               class="w-full glass rounded-xl px-5 py-4 text-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 placeholder-indigo-300">
        <input id="roomCode" type="text" placeholder="Kode Room (6 digit)" maxlength="6" inputmode="numeric"
               class="w-full glass rounded-xl px-5 py-4 text-lg text-center font-mono font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-yellow-400 placeholder-indigo-300">
        <button onclick="joinRoom()" class="w-full bg-green-500 hover:bg-green-600 active:bg-green-700 font-bold py-4 rounded-xl text-xl transition active:scale-95 shadow-lg">
          Gabung Sekarang
        </button>
      </div>

      <!-- Game Section -->
      <div id="game" class="hidden flex-1 flex flex-col">
        <div class="text-center py-3">
          <p class="text-indigo-200 text-sm">Room: <span id="displayCode" class="font-mono font-bold text-yellow-300"></span></p>
          <p id="status" class="text-base mt-1 font-medium drop-shadow text-yellow-200">Menunggu soal...</p>
        </div>

        <div id="options" class="flex-1 flex flex-col justify-center gap-3"></div>

        <div id="feedback" class="hidden text-center py-8 my-auto glass rounded-3xl p-6 shadow-2xl">
          <p id="feedbackText" class="text-4xl font-extrabold drop-shadow"></p>
          <p id="pointsText" class="text-yellow-300 text-2xl mt-3 font-extrabold"></p>
          <p class="text-indigo-200 text-xs mt-6">Menunggu semua pemain / soal berikutnya...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- TAMBAHAN UNTUK SCAN QR CODE ---
window.addEventListener('DOMContentLoaded', () => {
  // 1. Ambil URL parameter '?code=XXXXXX' dari hasil scan QR Code
  const urlParams = new URLSearchParams(window.location.search);
  const codeFromUrl = urlParams.get('code');

  // 2. Jika ada kode dari URL, otomatis isikan ke kolom input Kode Room
  if (codeFromUrl) {
    const roomInput = document.getElementById('roomCode'); // Sesuaikan dengan ID input kode room kamu
    if (roomInput) {
      roomInput.value = codeFromUrl;
    }

    // 3. Langsung arahkan kursor pemain ke input nama/nickname
    const nicknameInput = document.getElementById('nickname'); // Sesuaikan dengan ID input nama kamu
    if (nicknameInput) {
      nicknameInput.focus();
    }
  }
});
	
	const socket = io();
    let currentRoom = null;
    let answered = false;

    function triggerVibration(pattern) {
      if ("vibrate" in navigator) {
        navigator.vibrate(pattern);
      }
    }

    function joinRoom() {
      const nickname = document.getElementById('nickname').value.trim();
      const roomCode = document.getElementById('roomCode').value.trim();
      if (!nickname) return alert('Isi nama kamu dulu');
      if (!roomCode) return alert('Masukkan kode room');
      socket.emit('joinRoom', { roomCode, nickname });
    }

    document.getElementById('roomCode').addEventListener('keyup', e => { if (e.key === 'Enter') joinRoom(); });
    document.getElementById('nickname').addEventListener('keyup', e => { if (e.key === 'Enter') document.getElementById('roomCode').focus(); });

    socket.on('joined', (data) => {
      currentRoom = data.roomCode;
      document.getElementById('login').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('displayCode').textContent = data.roomCode;
    });

    socket.on('newQuestion', (q) => {
      answered = false;
      document.getElementById('status').textContent = q.category + ' • Jawab sekarang!';
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('options').classList.remove('hidden');

      const colors = ['bg-red-500', 'bg-blue-500', 'bg-yellow-500 text-black', 'bg-green-500'];
      const opts = document.getElementById('options');
      opts.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = `${colors[i]} w-full py-5 rounded-2xl text-xl font-extrabold shadow-lg transition active:scale-95 border-2 border-white/20`;
        btn.textContent = opt;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          triggerVibration(50); // Getaran halus tombol saat ditekan
          socket.emit('submitAnswer', { roomCode: currentRoom, answer: opt });
          document.querySelectorAll('#options button').forEach(b => {
            b.disabled = true;
            b.classList.add('opacity-40');
          });
          btn.classList.remove('opacity-40');
          btn.classList.add('ring-4', 'ring-white', 'scale-105');
        };
        opts.appendChild(btn);
      });
    });

    socket.on('answerFeedback', (data) => {
      document.getElementById('options').classList.add('hidden');
      document.getElementById('feedback').classList.remove('hidden');
      if (data.isCorrect) {
        triggerVibration([100, 50, 100]); // Pola getar menang
        document.getElementById('feedbackText').textContent = 'BENAR! 🎉';
        document.getElementById('feedbackText').className = 'text-4xl font-black text-green-400';
        document.getElementById('pointsText').textContent = `+${data.points} poin`;
      } else {
        triggerVibration(250); // Getaran panjang salah
        document.getElementById('feedbackText').textContent = 'SALAH ❌';
        document.getElementById('feedbackText').className = 'text-4xl font-black text-red-400';
        document.getElementById('pointsText').textContent = '';
      }
    });

    socket.on('questionEnded', () => {
      document.getElementById('status').textContent = 'Soal berikutnya segera...';
    });

    socket.on('gameFinished', (data) => {
      alert(data.message);
      document.getElementById('status').textContent = 'Permainan selesai. Menunggu Host memulai lagi...';
      document.getElementById('options').classList.add('hidden');
      document.getElementById('feedback').classList.add('hidden');
    });

    socket.on('error', (msg) => alert(msg));
  </script>
</body>
</html>
